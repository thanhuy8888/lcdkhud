<meta charset="utf-8">
<title>Sổ tay Liên chi đoàn KHUD</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sidebar điều hướng cố định + vùng nội dung dạng thẻ; chart vẽ bằng HTML/SVG nội tuyến */
:root{
  --bg:#eef4f9; --surface:#ffffff; --surface-2:#f4fafd;
  --ink:#0b2340;
  --sec:#44596f; --muted:#6f8299; --line:#d9e6f0;
  --accent:#0a74b8; --accent-2:#06598f; --on-accent:#ffffff;
  --cyan:#00a9e0; --gold:#c9a227;
  --nav-bg:#0e2d52; --nav-ink:#c3dcf0; --nav-ink-2:#7ea6c9; --nav-line:#1b4374;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --grid:#e4eef6; --axis:#bed2e2; --track:#e8f1f8;
  --seq-0:#eef4fd; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#2a78d6; --seq-5:#184f95;
  --shadow:0 1px 2px rgba(11,35,64,.06),0 8px 24px -16px rgba(11,35,64,.28);
  --ff:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fd:"Archivo","Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#071726; --surface:#112842; --surface-2:#17334f;
  --ink:#eaf3fb; --sec:#aec4da; --muted:#8aa2b9; --line:#1f3f61;
  --accent:#49b3e8; --accent-2:#7cc9f0; --on-accent:#06182a;
  --cyan:#49c6f2; --gold:#d9b84a;
  --nav-bg:#081e36; --nav-ink:#c3dcf0; --nav-ink-2:#7ea6c9; --nav-line:#163a5e;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --grid:#1b3a59; --axis:#2a5076; --track:#193550;
  --seq-0:#12293f; --seq-1:#1d3357; --seq-2:#1c4582; --seq-3:#2a6ac0; --seq-4:#3987e5; --seq-5:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#071726; --surface:#112842; --surface-2:#17334f;
  --ink:#eaf3fb; --sec:#aec4da; --muted:#8aa2b9; --line:#1f3f61;
  --accent:#49b3e8; --accent-2:#7cc9f0; --on-accent:#06182a;
  --cyan:#49c6f2; --gold:#d9b84a;
  --nav-bg:#081e36; --nav-ink:#c3dcf0; --nav-ink-2:#7ea6c9; --nav-line:#163a5e;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --grid:#1b3a59; --axis:#2a5076; --track:#193550;
  --seq-0:#12293f; --seq-1:#1d3357; --seq-2:#1c4582; --seq-3:#2a6ac0; --seq-4:#3987e5; --seq-5:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--ff);-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:var(--fd)}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:15px;margin:0 0 2px}
h3{font-size:13.5px;margin:0;letter-spacing:-.005em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
/* ---- khung ---- */
.app{display:flex;min-height:100%}
.side{width:244px;flex:0 0 244px;background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--nav-line);border-top:3px solid var(--cyan);background:linear-gradient(180deg,color-mix(in srgb,var(--cyan) 12%,transparent),transparent)}
.brand img{width:46px;height:46px;flex:0 0 auto;border-radius:10px;background:#fff;padding:2px;object-fit:contain;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.brand>div{min-width:0}
.brand b{display:block;color:#fff;font-family:var(--fd);font-size:14px;line-height:1.25;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--nav-ink-2)}
.rolebox{padding:12px 14px;border-bottom:1px solid var(--nav-line)}
.rolebox label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-ink-2);font-weight:600}
.rolebox select{width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--nav-line);background:#172338;color:#fff;font:500 13px var(--ff)}
.nav{padding:8px;flex:1;overflow-y:auto}
.nav a{display:block;padding:8px 11px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:#17233a}
.nav a[aria-current]{background:var(--accent);color:#fff;font-weight:600}
.nav .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-ink-2);padding:14px 11px 5px;font-weight:600}
.side footer{padding:10px 16px;border-top:1px solid var(--nav-line);font-size:11px;color:var(--nav-ink-2);display:flex;gap:10px;flex-wrap:wrap}
.side footer button{background:none;border:0;color:var(--nav-ink-2);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.main{flex:1;min-width:0;padding-block:22px 64px;padding-inline:26px}
.sub{color:var(--muted);margin:0 0 18px;font-size:13px}
/* ---- thẻ, lưới ---- */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card>header{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.card>header p{margin:0;font-size:12px;color:var(--muted)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
.tile .lbl{font-size:11.5px;color:var(--muted);font-weight:500}
.tile .val{font-family:var(--fd);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.tile .foot{font-size:11.5px;color:var(--sec);margin-top:3px}
/* ---- bảng ---- */
.scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10.5px/1.4 var(--ff);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.t2{font-size:11.5px;color:var(--muted)}
/* ---- phần tử ---- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-xs{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.p-good{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.p-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:#8a6100;border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.p-ser{background:color-mix(in srgb,var(--serious) 16%,transparent);color:#a2502a;border-color:color-mix(in srgb,var(--serious) 35%,transparent)}
.p-crit{background:color-mix(in srgb,var(--crit) 13%,transparent);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.p-mute{background:var(--track);color:var(--sec)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-warn{color:#fab219}:root:not([data-theme="light"]) .p-ser{color:#ec835a}:root:not([data-theme="light"]) .rk.r1{color:#f0d27a}}
:root[data-theme="dark"] .p-warn{color:#fab219}
:root[data-theme="dark"] .p-ser{color:#ec835a}
:root[data-theme="dark"] .rk.r1{color:#f0d27a}
button,.btn{font:500 13px var(--ff);cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:9px}
button:hover{background:var(--surface-2)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b-p{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.b-p:hover{background:var(--accent-2);border-color:var(--accent-2)}
.b-s{padding:4px 9px;font-size:12px;border-radius:7px}
.b-ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.b-no{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.end{margin-left:auto}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head .sub{margin:0}
input,select,textarea{font:400 13px var(--ff);padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:11px;min-width:0}
.f label{font-size:11.5px;color:var(--sec);font-weight:600}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;width:min(520px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(5,10,20,.5)}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13px}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 12px;border-radius:9px;font-size:12.5px;color:var(--sec);margin-bottom:14px}
.rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--track);font:600 11.5px var(--fd);color:var(--sec)}
.rk.r1{background:color-mix(in srgb,var(--gold) 32%,transparent);color:#7a5600}.rk.r2{background:#e2e7ef;color:#394459}.rk.r3{background:#f3ddc7;color:#7d4b1c}
/* ---- chart ---- */
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(72px,auto) 1fr minmax(44px,auto);gap:10px;align-items:center;font-size:12.5px}
.barrow>span:first-child{color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{background:var(--track);border-radius:5px;height:14px;position:relative;overflow:hidden}
.track>i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.barrow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stack{display:flex;gap:2px;height:20px;border-radius:5px;overflow:hidden;background:var(--track)}
.stack i{display:block;height:100%;font-size:10px;color:#fff;text-align:center;line-height:20px;font-variant-numeric:tabular-nums;overflow:hidden;min-width:0}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sec);margin-top:12px}
.lgd b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hm{border-collapse:separate;border-spacing:2px;font-size:11.5px}
.hm th{border:0;padding:4px 6px;font-size:10px;vertical-align:bottom}
.hm th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:118px;text-align:left;font-weight:600;letter-spacing:.02em;text-transform:none}
.hm td{border:0;padding:0}
.hm td.lab{padding-right:8px;white-space:nowrap;font-weight:500;font-size:12px}
.hm .cell{display:grid;place-items:center;width:100%;min-width:38px;height:30px;border-radius:5px;font-variant-numeric:tabular-nums;font-weight:600;cursor:default}
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--nav-bg);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.45;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .12s;border:1px solid var(--nav-line)}
#tip b{color:#fff}
.mini{display:flex;gap:2px;align-items:flex-end;height:30px}
.mini i{flex:1;background:var(--seq-3);border-radius:2px 2px 0 0;min-height:2px}

/* ---- Topbar & Tiện ích ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;box-shadow:var(--shadow)}
.topbar-info{display:flex;align-items:center;gap:10px;font-size:13px}
.topbar-info .role-tag{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-weight:600;padding:3px 10px;border-radius:999px;font-size:12px}
.topbar-actions{display:flex;align-items:center;gap:8px;position:relative}
.topbar-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;transition:all .15s}
.topbar-btn:hover{background:var(--surface);border-color:var(--accent);color:var(--accent)}

/* Chuông thông báo */
.notif-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:all .15s}
.notif-btn:hover{border-color:var(--accent);background:var(--surface-2)}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:999px;box-shadow:0 0 0 2px var(--surface)}
.notif-dropdown{position:absolute;right:0;top:calc(100% + 8px);width:360px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(11,35,64,.18);z-index:90;display:none;flex-direction:column;overflow:hidden}
.notif-dropdown.open{display:flex;animation:dropFade .15s ease-out}
@keyframes dropFade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.notif-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.notif-list{max-height:360px;overflow-y:auto;display:flex;flex-direction:column}
.notif-item{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;cursor:pointer;transition:background .12s}
.notif-item:last-child{border-bottom:0}
.notif-item:hover{background:var(--surface-2)}
.notif-item.is-crit{border-left:3px solid var(--crit)}
.notif-item.is-warn{border-left:3px solid var(--warn)}
.notif-item.is-info{border-left:3px solid var(--accent)}
.notif-icon{font-size:16px;flex:0 0 20px;margin-top:1px}
.notif-body{flex:1;min-width:0}
.notif-title{font-weight:600;font-size:12.5px;color:var(--ink);margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.notif-desc{font-size:12px;color:var(--sec);line-height:1.4}
.notif-time{font-size:11px;color:var(--muted);margin-top:3px}

/* Banner nhắc việc khẩn cấp */
.alert-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;margin-bottom:16px;border:1px solid transparent;background:var(--surface);box-shadow:var(--shadow)}
.alert-banner.b-crit{background:color-mix(in srgb,var(--crit) 8%,var(--surface));border-color:color-mix(in srgb,var(--crit) 30%,transparent);color:var(--crit)}
.alert-banner.b-warn{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:#8a6100}
:root[data-theme="dark"] .alert-banner.b-warn{color:#fab219}
.alert-banner-icon{font-size:20px;flex:0 0 auto}
.alert-banner-text{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.alert-banner-text b{display:block;margin-bottom:2px}
.alert-banner-act{flex:0 0 auto;display:flex;gap:8px;align-items:center}

/* Khối VIỆC CẦN LÀM ƯU TIÊN */
.todo-hero{background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border:1.5px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px -8px rgba(10,116,184,.25)}
.todo-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.todo-title{display:flex;align-items:center;gap:9px}
.todo-title h2{font-size:17px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.todo-tabs{display:flex;gap:6px;flex-wrap:wrap}
.todo-tab{padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--sec);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.todo-tab:hover{border-color:var(--accent);color:var(--accent)}
.todo-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.todo-tab .cnt{padding:1px 6px;border-radius:999px;font-size:10.5px;background:rgba(0,0,0,.08)}
.todo-tab.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.todo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.todo-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .15s}
.todo-item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 4px 12px rgba(11,35,64,.08);transform:translateY(-1px)}
.todo-item.p-urgent{border-left:4px solid var(--crit)}
.todo-item.p-near{border-left:4px solid var(--warn)}
.todo-item.p-pending{border-left:4px solid var(--accent)}
.todo-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.todo-item-title{font-weight:600;font-size:13.5px;color:var(--ink);line-height:1.35}
.todo-item-sub{font-size:12px;color:var(--muted);margin-top:3px}
.todo-item-note{font-size:12px;padding:6px 9px;border-radius:6px;background:color-mix(in srgb,var(--crit) 8%,transparent);color:var(--crit);margin-top:6px;border:1px dashed color-mix(in srgb,var(--crit) 25%,transparent)}
.todo-item-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--line);margin-top:auto}

/* Tooltip & nhãn hỗ trợ giải thích */
.pill[data-tip]{cursor:help;position:relative}
.pill[data-tip]::after{content:'';position:relative;display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;margin-left:2px;vertical-align:middle}

/* Modal rộng cho hướng dẫn minh chứng & ý nghĩa nhãn */
dialog.dlg-wide{width:min(720px,95vw);max-height:88vh;overflow-y:auto}
.guide-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:var(--surface-2)}
.guide-box h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}
.guide-box ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--sec)}
.guide-box li{margin-bottom:4px}
.mc-hint-box{background:color-mix(in srgb,var(--cyan) 10%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--ink);margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* Biểu đồ thanh tiến độ chỉ tiêu có vạch mốc 100% */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.chart-row{display:grid;grid-template-columns:minmax(180px,260px) 1fr minmax(70px,90px);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.chart-row:last-child{border-bottom:0}
.chart-info b{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-info span{font-size:11.5px;color:var(--muted)}
.track-target{position:relative;background:var(--track);border-radius:6px;height:18px}
.track-target .bar-fill{display:block;height:100%;border-radius:5px;transition:width .25s ease}
.track-target .target-line{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35;z-index:2;border-left:1px dashed #fff}
.chart-val{text-align:right;font-family:var(--fd);font-weight:700;font-size:13.5px}

.view-pills{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:9px;border:1px solid var(--line);gap:3px}
.view-pill{padding:5px 12px;border-radius:7px;border:0;background:none;font-size:12.5px;font-weight:600;color:var(--sec);cursor:pointer;transition:all .15s}
.view-pill:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.view-pill.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Bảng ma trận phẳng nằm ngang dễ đọc */
.clean-matrix{width:100%;border-collapse:collapse;font-size:12.5px}
.clean-matrix th{padding:10px 8px;border-bottom:2px solid var(--line);text-align:center;font-size:11.5px;font-weight:600;white-space:nowrap}
.clean-matrix th:first-child{text-align:left}
.clean-matrix td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.clean-matrix td:first-child{text-align:left;font-weight:600}
.matrix-badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 7px;border-radius:6px;font-weight:600;font-size:12px;font-family:var(--fd)}

/* Dropdown chọn trạng thái trực tiếp & link editor */
.st-sel{padding:3px 8px;font-size:12px;font-weight:600;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:all .15s}
.st-sel:hover{border-color:var(--accent)}
.st-sel[data-st="ok"]{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.st-sel[data-st="wait"]{color:#8a6100;border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.st-sel[data-st="no"]{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}

.link-item{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.link-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);text-decoration:none;font-weight:500;transition:all .15s}
.link-badge:hover{background:color-mix(in srgb,var(--accent) 20%,transparent);text-decoration:underline}
.btn-edit-link{display:inline-flex;align-items:center;padding:2px 6px;border-radius:5px;border:1px solid transparent;background:none;color:var(--muted);font-size:11px;cursor:pointer}
.btn-edit-link:hover{color:var(--accent);border-color:var(--line);background:var(--surface-2)}

/* Thẻ quản lý dữ liệu thật */
.mgmt-grid{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0}
.mgmt-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:14px;transition:border-color .15s}

.mgmt-card-info h4{margin:0 0 3px;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:6px}
.mgmt-card-info p{margin:0;font-size:12px;color:var(--sec);line-height:1.4}
.mgmt-card.is-recommended{border-left:4px solid var(--good);background:color-mix(in srgb,var(--good) 4%,var(--surface-2))}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3,.g11{grid-template-columns:minmax(0,1fr)}}

<script>
/* Khung tiêu chí, dữ liệu mẫu và lưu trữ cục bộ. */
/* ===================== KHUNG TIÊU CHÍ ===================== */
const TODAY=new Date().toISOString().slice(0,10); // ngày thật của máy, dữ liệu mẫu neo quanh tháng 10/2026
const CRIT=[
 {id:'ct',ten:'Giáo dục chính trị – tư tưởng',max:20,c:'var(--s1)'},
 {id:'tn',ten:'Tình nguyện – vì cộng đồng',max:20,c:'var(--s2)'},
 {id:'ht',ten:'Học tập – NCKH – rèn luyện',max:20,c:'var(--s3)'},
 {id:'xd',ten:'Xây dựng Đoàn – phát triển Đảng',max:20,c:'var(--s4)'},
 {id:'hc',ten:'Tổ chức – báo cáo – đoàn phí',max:20,c:'var(--s5)'},
];
const critOf=id=>CRIT.find(c=>c.id===id);
const RANKS=[[90,'Xuất sắc','p-xs'],[80,'Tốt','p-good'],[65,'Khá','p-warn'],[50,'Trung bình','p-ser'],[0,'Yếu','p-crit']];
const xepLoai=d=>RANKS.find(r=>d>=r[0]);
const TRE_PHAT=0.8; // nộp sau hạn chót chỉ còn 80% điểm

/** Tính khoảng cách (số ngày) từ hoạt động đến mốc ngày today (mặc định TODAY) */
function khoangCachNgayKH(k, today = TODAY){
 const bd = k.batDau || today;
 const hc = k.hanChot || bd;
 if (bd <= today && today <= hc) return 0; // Đang diễn ra trong khoảng thời gian này
 const tNow = new Date(today + 'T00:00:00').getTime();
 if (today < bd) {
  return Math.round(Math.abs(new Date(bd + 'T00:00:00').getTime() - tNow) / 86400000);
 }
 return Math.round(Math.abs(tNow - new Date(hc + 'T00:00:00').getTime()) / 86400000);
}

/** So sánh thứ tự giữa 2 hoạt động theo tiêu chí sắp xếp */
function soSanhKH(a, b, kieu = 'near', today = TODAY){
 if(kieu === 'near'){
  const ca = khoangCachNgayKH(a, today);
  const cb = khoangCachNgayKH(b, today);
  if(ca !== cb) return ca - cb; // Càng gần ngày bây giờ càng lên đầu
  // Nếu khoảng cách bằng nhau: việc chưa xong ưu tiên hơn việc đã xong
  if(a.tienDo === 'xong' && b.tienDo !== 'xong') return 1;
  if(b.tienDo === 'xong' && a.tienDo !== 'xong') return -1;
  // Ưu tiên việc đang/sắp diễn ra trước việc đã kết thúc
  const aFuture = (a.hanChot || a.batDau) >= today ? 1 : 0;
  const bFuture = (b.hanChot || b.batDau) >= today ? 1 : 0;
  if(aFuture !== bFuture) return bFuture - aFuture;
  return (b.batDau || '').localeCompare(a.batDau || '') || b.id - a.id;
 }
 if(kieu === 'newest'){
  return (b.batDau || '').localeCompare(a.batDau || '') || (b.hanChot || '').localeCompare(a.hanChot || '') || b.id - a.id;
 }
 if(kieu === 'oldest'){
  return (a.batDau || '').localeCompare(b.batDau || '') || (a.hanChot || '').localeCompare(b.hanChot || '') || a.id - b.id;
 }
 if(kieu === 'ma'){
  return a.ma.localeCompare(b.ma) || a.id - b.id;
 }
 return 0;
}

/** Buổi đã diễn ra và đã chốt điểm danh — buổi chưa điểm danh không kéo tụt chuyên cần của ai. */
const buoiDaHop=()=>DB.hop.filter(h=>h.ngay<=TODAY&&daDiemDanh(h));
const ddOf=(hopId,nsId)=>DB.dd.find(d=>d.hopId===hopId&&d.nsId===nsId);
function chuyenCan(nsId){
 const hs=buoiDaHop();
 const co=hs.filter(h=>{const d=ddOf(h.id,nsId);return d&&d.co}).length;
 const muon=hs.filter(h=>{const d=ddOf(h.id,nsId);return d&&d.co&&d.muon}).length;
 return {tong:hs.length,co,vang:hs.length-co,muon,ty:hs.length?co/hs.length:1};
}
/** Mức hoàn thành của một đầu việc: có chỉ tiêu thì theo số liệu chi đoàn, không thì theo tiến độ. */
const mucHT=k=>{
 if(!k.chiTieu)return k.tienDo==='xong'?100:k.tienDo==='dang'?60:0;
 const t=thongKeKH(k);
 return Math.round(0.6*Math.min(100,t.tbTy)+0.4*t.nop/DB.cd.length*100);
};
const nhiemVu=id=>{const ks=DB.kh.filter(k=>k.ptIds.includes(id));
 return {giao:ks.length,xong:ks.filter(k=>k.tienDo==='xong').length,
  tre:ks.filter(k=>k.hanChot<TODAY&&k.tienDo!=='xong').length}};
function kpiBCH(id){
 const u=UV(id);
 const khs=DB.kh.filter(k=>k.ptIds.includes(id)&&k.batDau<=TODAY).map(k=>({k,ht:mucHT(k)}));
 const cds=u.theoDoi.length?u.theoDoi:DB.cd.map(c=>c.id);
 const tbCD=cds.reduce((s,i)=>s+kpi(i).tong,0)/cds.length/100;
 const ton=DB.bc.filter(b=>b.status==='wait'&&KH(b.khId).ptIds.includes(id)).length
  +DB.kh.filter(k=>k.ptIds.includes(id)&&k.chiTieu&&k.hanChot<TODAY&&k.batBuoc&&DB.cd.some(c=>!bcOf(k.id,c.id))).length;
 const cc=chuyenCan(id),nv=nhiemVu(id);
 const ct=[
  {...BCRIT[0],diem:+(35*(khs.length?khs.reduce((s,x)=>s+x.ht,0)/khs.length/100:0)).toFixed(1),
   ghi:khs.length?khs.map(x=>x.k.ma).join(', '):'chưa có đầu việc nào đã bắt đầu'},
  {...BCRIT[1],diem:+(25*tbCD).toFixed(1),
   ghi:u.theoDoi.length?u.theoDoi.map(i=>CD(i).ma).join(', '):'theo dõi chung toàn khoa'},
  {...BCRIT[2],diem:Math.max(0,20-4*ton),
   ghi:ton?ton+' hồ sơ tồn (chờ duyệt hoặc chi đoàn quá hạn chưa nộp)':'không còn hồ sơ tồn đọng'},
  {...BCRIT[3],diem:+(12*cc.ty+8*nv.xong/Math.max(1,nv.giao)).toFixed(1),
   ghi:cc.co+'/'+cc.tong+' buổi sinh hoạt · '+nv.xong+'/'+nv.giao+' đầu việc hoàn thành'+(cc.muon?' · đi muộn '+cc.muon+' buổi':'')},
 ];
 const tong=Math.round(ct.reduce((s,x)=>s+x.diem,0));
 return {u,ct,tong,xl:xepLoai(tong),khs,ton,cds,cc,nv};
}
const bangBCH=()=>DB.ns.filter(u=>u.bch).map(u=>kpiBCH(u.id)).sort((a,b)=>b.tong-a.tong);
const thangKeys=['2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10'];
const thangNhan=['T3','T4','T5','T6','T7','T8','T9','T10'];
function luotTheoThang(cdId){
 return thangKeys.map(t=>{
  let s=0;
  DB.bc.filter(b=>b.status==='ok'&&(!cdId||b.cdId===cdId)).forEach(b=>{const k=KH(b.khId);if(k.hanChot.slice(0,7)===t)s+=b.soLuot});
  DB.hd.filter(h=>h.status==='ok'&&(!cdId||h.cdId===cdId)).forEach(h=>{if(h.ngay.slice(0,7)===t)s+=h.sl});
  return s;
 });
}

const tip=(txt)=>' data-tip="'+esc(txt)+'"';
const tile=(lbl,val,foot='')=>`<div class="tile"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="foot">${foot}</div></div>`;

/** Tạo pill có tooltip tự động giải thích ý nghĩa trạng thái */
function pill(t,c,customTip){
 const tipText = customTip || (STATUS_DESC[t] ? `${t}: ${STATUS_DESC[t]}` : '');
 return `<span class="pill ${c}"${tipText ? tip(tipText) : ''}>${t}</span>`;
}

const pillXL=xl=>pill(xl[1],xl[2],`Xếp loại ${xl[1]} (thang điểm: Xuất sắc ≥90 · Tốt ≥80 · Khá ≥65 · Trung bình ≥50 · Yếu <50)`);

 ok:['Đã duyệt','p-good','Minh chứng hợp lệ, điểm KPI đã được cộng chính thức.'],
 wait:['Chờ duyệt','p-warn','Hồ sơ đang đợi Ban Chấp hành LCĐ kiểm tra duyệt minh chứng.'],
 no:['Trả lại','p-crit','Minh chứng chưa đạt, cần bổ sung nộp lại để được xét điểm.']

const pillST=s=>{const item=ST[s]||ST.wait;return pill(item[0],item[1],item[0]+': '+item[2])};

const seqCell=ty=>ty>=100?'var(--seq-5)':ty>=80?'var(--seq-4)':ty>=55?'var(--seq-3)':ty>=25?'var(--seq-2)':ty>0?'var(--seq-1)':'var(--seq-0)';
const seqInk=ty=>ty>=80?'#fff':'var(--sec)';

/** Dãy thanh ngang xếp hạng (1 chuỗi số liệu → 1 màu). */
function rankBars(items,{max,suffix='',color='var(--s1)'}={}){
 const m=max||Math.max(...items.map(i=>i.v),1);
 return `<div class="bars">${items.map(i=>`<div class="barrow">
  <span${tip(i.tip||i.l)}>${esc(i.l)}</span>
  <span class="track"><i style="width:${Math.max(1,i.v/m*100)}%;background:${i.c||color}"${tip(i.tip||i.l+': '+i.v+suffix)}></i></span>
  <span class="v">${i.v}${suffix}</span></div>`).join('')}</div>`;
}

}

/** Biểu đồ đường: lượt tham gia theo tháng. */
function lineChart(series,{w=640,h=210}={}){
 const pl=42,pr=14,pt=14,pb=28,iw=w-pl-pr,ih=h-pt-pb;
 const all=series.flatMap(s=>s.v);
 const mx=Math.max(10,Math.ceil(Math.max(...all)/50)*50);
 const X=i=>pl+(series[0].v.length===1?iw/2:i*iw/(series[0].v.length-1));
 const Y=v=>pt+ih-v/mx*ih;
 const ticks=[0,.25,.5,.75,1].map(t=>Math.round(mx*t));
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;height:auto;overflow:visible" role="img" aria-label="Lượt tham gia theo tháng">
 ${ticks.map(t=>`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>
   <text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${t}</text>`).join('')}
 <line x1="${pl}" x2="${w-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)" stroke-width="1"/>
 ${thangNhan.map((t,i)=>`<text x="${X(i)}" y="${h-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${t}</text>`).join('')}
 ${series.map(s=>`<path d="${s.v.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ')} L${X(s.v.length-1)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="${s.c}" opacity=".10"/>
  <path d="${s.v.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>
  ${s.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===s.v.length-1?5:4}" fill="${s.c}" stroke="var(--surface)" stroke-width="2"${tip(s.n+' · tháng '+thangNhan[i].slice(1)+': '+v+' lượt')}/>`).join('')}
  <text x="${X(s.v.length-1)}" y="${Y(s.v[s.v.length-1])-12}" text-anchor="end" font-size="11.5" font-weight="700" fill="${s.c}">${s.v[s.v.length-1]}</text>`).join('')}
 </svg>`;
}

/* ===================== HỆ THỐNG THÔNG BÁO & NHẮC VIỆC ===================== */
function layThongBao(){
 const list=[];
 if(state.role==='cd'){
  const c=CD(state.cdId);
  // 1. Hồ sơ bị trả lại cần sửa ngay
  const biTraLai=DB.bc.filter(b=>b.cdId===c.id&&b.status==='no');
  biTraLai.forEach(b=>{
   const k=KH(b.khId);
   list.push({
    loai:'crit',icon:'🔴',
    tieuDe:`Hồ sơ "${k.ma}" bị trả lại`,
    noiDung:b.nx||'Minh chứng chưa đạt yêu cầu, đề nghị bổ sung nộp lại.',
    time:`Nộp ngày ${dmy(b.ngayNop)}`,
    action:()=>formBC(b.khId),
    btnText:'Sửa & nộp lại'
   });
  });
  // 2. Kế hoạch LCĐ giao sắp đến hạn hoặc quá hạn chưa nộp
  const giao=DB.kh.filter(k=>k.chiTieu&&k.batDau<=TODAY);
  giao.forEach(k=>{
   const b=bcOf(k.id,c.id);
   if(!b){
    const tre=k.hanChot<TODAY;
    const sapHet=!tre && k.hanChot<=dayAdd(TODAY,7);
    if(tre){
     list.push({
      loai:'crit',icon:'⏰',
      tieuDe:`Quá hạn: ${k.ma} · ${k.ten}`,
      noiDung:`Hạn chót là ${dmy(k.hanChot)}. Nộp muộn sẽ bị trừ 20% điểm KPI.`,
      time:`Hạn ${dmy(k.hanChot)}`,
      action:()=>formBC(k.id),
      btnText:'Nộp ngay'
     });
    }else if(sapHet){
     list.push({
      loai:'warn',icon:'⚠️',
      tieuDe:`Sắp hết hạn: ${k.ma} · ${k.ten}`,
      noiDung:`Chỉ tiêu ${chiTieuSo(k,c)} lượt. Còn ít ngày trước hạn chót ${dmy(k.hanChot)}.`,
      time:`Hạn ${dmy(k.hanChot)}`,
      action:()=>formBC(k.id),
      btnText:'Nộp báo cáo'
     });
    }
   }
  });
  // 3. Hồ sơ đang chờ duyệt
  const choDuyet=DB.bc.filter(b=>b.cdId===c.id&&b.status==='wait').length+DB.hd.filter(h=>h.cdId===c.id&&h.status==='wait').length;
  if(choDuyet>0){
   list.push({
    loai:'info',icon:'⏳',
    tieuDe:`${choDuyet} hồ sơ đang chờ LCĐ duyệt`,
    noiDung:'BCH LCĐ đang thẩm định minh chứng để công nhận điểm KPI.',
    time:'Đang xử lý',
    action:()=>go('nhiemvu'),
    btnText:'Xem hồ sơ'
   });
  }
  // 4. Kế hoạch mới triển khai
  const moi=DB.kh.filter(k=>k.chiTieu&&k.batDau<=TODAY&&k.batDau>=dayAdd(TODAY,-14));
  moi.slice(0,2).forEach(k=>{
   list.push({
    loai:'info',icon:'📢',
    tieuDe:`Kế hoạch mới: ${k.ma} · ${k.ten}`,
    noiDung:`Chỉ tiêu ${chiTieuSo(k,c)} lượt. Hạn chót ${dmy(k.hanChot)}.`,
    time:`Bắt đầu ${dmy(k.batDau)}`,
    action:()=>go('nhiemvu'),
    btnText:'Xem chi tiết'
   });
  });
 } else {
  // Với BCH Liên chi đoàn
  // 1. Hồ sơ chờ LCĐ duyệt
  const cho=DB.bc.filter(b=>b.status==='wait').length+DB.hd.filter(h=>h.status==='wait').length;
  if(cho>0){
   list.push({
    loai:'warn',icon:'📥',
    tieuDe:`Có ${cho} hồ sơ đang chờ LCĐ duyệt`,
    noiDung:'Các chi đoàn đã gửi báo cáo và minh chứng, cần kiểm tra để chốt điểm KPI.',
    time:'Cần xử lý',
    action:()=>go('duyet'),
    btnText:'Vào duyệt ngay'
   });
  }
  // 2. Mốc công tác quá hạn hoặc đến hạn trong 7 ngày
  const mocs=mocDenHan(7);
  mocs.slice(0,3).forEach(({k,m})=>{
   const tre=m.han<TODAY;
   list.push({
    loai:tre?'crit':'warn',icon:tre?'🚨':'⏰',
    tieuDe:`${tre?'Quá hạn':'Sắp đến hạn'}: ${m.ten}`,
    noiDung:`Thuộc ${k.ma} · ${k.ten} (Phụ trách: ${m.nsId&&UV(m.nsId)?UV(m.nsId).ten:'Chưa phân công'})`,
    time:`Hạn ${dmy(m.han)}`,
    action:()=>go('khct',{khId:k.id}),
    btnText:'Mở mốc'
   });
  });
  // 3. Chi đoàn trễ hạn kế hoạch bắt buộc
  const treHen=DB.kh.filter(k=>k.chiTieu&&k.batBuoc&&k.hanChot<TODAY).flatMap(k=>DB.cd.filter(c=>!bcOf(k.id,c.id)).map(c=>({k,c})));
  if(treHen.length>0){
   list.push({
    loai:'crit',icon:'⚠️',
    tieuDe:`${treHen.length} lượt chi đoàn nợ việc bắt buộc`,
    noiDung:`Các chi đoàn chưa nộp báo cáo cho kế hoạch đã hết hạn.`,
    time:`Hạn đã qua`,
    action:()=>go('hoatdong'),
    btnText:'Xem chi tiết'
   });
  }
 }
 return list;
}

/** Đổi trạng thái báo cáo chi đoàn (ok / wait / no) */
function doiTrangThaiBC(id, newSt){
 const b = DB.bc.find(x => x.id === id);
 if(!b) return;
 if(newSt === 'no'){
  const lyDo = prompt('Nhập nhận xét / lý do trả lại để chi đoàn sửa bổ sung:', b.nx || 'Minh chứng chưa đủ, đề nghị bổ sung ảnh hoạt động và danh sách ký tên.');
  if(lyDo === null) { render(); return; }
  b.nx = lyDo.trim() || 'Minh chứng chưa đạt yêu cầu, đề nghị bổ sung nộp lại.';
 } else if(newSt === 'ok') {
  b.nx = '';
 }

/* Hệ thống Xác thực, Phân quyền và Quản trị Người dùng */
/* ===================== AUTH OBJECT ===================== */
const AUTH_STORAGE_KEY = 'lcdkhud_auth_session';

const ROLE_INFO = {
 admin: { ten: 'Quản trị viên', badge: 'p-crit', icon: '🛡️', desc: 'Toàn quyền cấu hình hệ thống, quản trị tài khoản và cơ sở dữ liệu' },
 lcd:   { ten: 'BCH Liên chi đoàn', badge: 'p-xs', icon: '🏛️', desc: 'Quản lý toàn diện công tác Đoàn, giao chỉ tiêu, duyệt báo cáo và đánh giá KPI' },
 cd:    { ten: 'BCH Chi đoàn', badge: 'p-good', icon: '🚩', desc: 'Quản lý hoạt động chi đoàn, nộp báo cáo minh chứng và theo dõi đoàn viên' },
 bbt:   { ten: 'Ban Biên tập / Giám sát', badge: 'p-warn', icon: '📝', desc: 'Xem thông tin, giám sát số liệu và hỗ trợ truyền thông' }
};

const auth = {
 currentUser: null,

 /** Khởi tạo phiên đăng nhập từ LocalStorage hoặc SessionStorage */
 init(){
  try {
   let raw = localStorage.getItem(AUTH_STORAGE_KEY) || sessionStorage.getItem(AUTH_STORAGE_KEY);
   if(raw){
    const sess = JSON.parse(raw);
    const u = (DB.users || []).find(x => x.id === sess.id && x.username === sess.username);
    if(u && u.active !== false){
     this.currentUser = u;
     this.dongBoQuyenState();
     return;
    }
   }
  } catch(e) {}
  this.currentUser = null;
 },

 /** Đồng bộ state hệ thống theo vai trò người dùng */
 dongBoQuyenState(){
  if(!this.currentUser) return;
  const u = this.currentUser;
  if(u.role === 'cd'){
   state.role = 'cd';
   state.cdId = u.cdId || (DB.cd && DB.cd[0] ? DB.cd[0].id : 1);
  } else {
   if(state.role !== 'cd') {
    state.role = 'lcd';
   }
  }
 },

 /** Kiểm tra xem tài khoản có quyền cụ thể hay không */
 coQuyen(quyenId, customUser){
  const u = customUser || this.currentUser;
  if(!u) return false;
  if(u.role === 'admin') return true;
  return Array.isArray(u.quyen) && u.quyen.includes(quyenId);
 },

 /** Bật / Tắt một quyền cụ thể cho một tài khoản (Check trực tiếp trên ma trận) */
 doiQuyenNguoiDung(userId, quyenId, bat){
  const u = (DB.users || []).find(x => x.id === userId);
  if(!u) return;
  if(u.role === 'admin'){
   alert('Quản trị viên (Admin) mặc định luôn có tất cả quyền trong hệ thống.');
   render();
   return;
  }
  if(!Array.isArray(u.quyen)){
   u.quyen = [...(QUYEN_THEO_VAI_TRO[u.role] || QUYEN_THEO_VAI_TRO.cd)];
  }
  if(bat){
   if(!u.quyen.includes(quyenId)) u.quyen.push(quyenId);
  } else {
   u.quyen = u.quyen.filter(x => x !== quyenId);
  }
  save();
  this.hienToast(`Đã ${bat ? 'cấp' : 'thu hồi'} quyền "${quyenId}" cho ${u.ten}`);
 },

 /** Chuẩn hóa quyền của một tài khoản theo vai trò mặc định */
 chuanHoaQuyenUser(userId){
  const u = (DB.users || []).find(x => x.id === userId);
  if(!u) return;
  u.quyen = [...(QUYEN_THEO_VAI_TRO[u.role] || QUYEN_THEO_VAI_TRO.cd)];
  save();
  render();
  this.hienToast(`Đã khôi phục quyền chuẩn cho ${u.ten}`);
 },

 /** Chuẩn hóa toàn bộ quyền của tất cả tài khoản */
 chuanHoaToanBoQuyen(){
  (DB.users || []).forEach(u => {
   u.quyen = [...(QUYEN_THEO_VAI_TRO[u.role] || QUYEN_THEO_VAI_TRO.cd)];
  });
  save();
  render();
  alert('Đã chuẩn hóa toàn bộ quyền hạn của tất cả tài khoản theo vai trò mặc định.');
 },

 /** Lưu cập nhật danh sách quyền cho một tài khoản */
 capNhatQuyenUser(userId, danhSachQuyenMoi){
  const u = (DB.users || []).find(x => x.id === userId);
  if(!u) return { ok: false, msg: 'Không tìm thấy tài khoản!' };
  u.quyen = [...danhSachQuyenMoi];
  save();
  return { ok: true, user: u };
 },

 /** Hiển thị toast thông báo nhanh khi check quyền */
 hienToast(msg){
  let t = document.getElementById('toastBox');
  if(!t){
   t = document.createElement('div');
   t.id = 'toastBox';
   t.className = 'toast-box';
   document.body.appendChild(t);
  }
  t.textContent = '✓ ' + msg;
  t.classList.add('show');
  clearTimeout(this._toastTimer);
  this._toastTimer = setTimeout(() => {
   t.classList.remove('show');
  }, 2200);
 },

 /** Đăng nhập */
 login(username, password, remember = true){
  const uName = String(username || '').trim().toLowerCase();
  const pass = String(password || '').trim();

  if(!uName || !pass){
   return { ok: false, msg: 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!' };
  }

  const u = (DB.users || []).find(x => x.username.toLowerCase() === uName);
  if(!u || u.password !== pass){
   return { ok: false, msg: 'Tên đăng nhập hoặc mật khẩu không chính xác!' };
  }

  if(u.active === false){
   return { ok: false, msg: 'Tài khoản này đang bị tạm khóa. Vui lòng liên hệ Admin / BCH LCĐ.' };
  }

  u.lanCuoi = new Date().toLocaleString('vi-VN');
  save();

  this.currentUser = u;
  this.dongBoQuyenState();

  const sessData = JSON.stringify({ id: u.id, username: u.username });
  if(remember){
   localStorage.setItem(AUTH_STORAGE_KEY, sessData);
  } else {
   sessionStorage.setItem(AUTH_STORAGE_KEY, sessData);
  }

  render();
  return { ok: true, user: u };
 },

 /** Đăng xuất */
 logout(){
  localStorage.removeItem(AUTH_STORAGE_KEY);
  sessionStorage.removeItem(AUTH_STORAGE_KEY);
  this.currentUser = null;
  state.page = 'tongquan';
  render();
 },

 /** Đổi mật khẩu của người dùng hiện tại */
 doiMatKhau(oldPass, newPass){
  if(!this.currentUser) return { ok: false, msg: 'Chưa đăng nhập!' };
  if(this.currentUser.password !== oldPass){
   return { ok: false, msg: 'Mật khẩu hiện tại không đúng!' };
  }
  if(!newPass || newPass.length < 4){
   return { ok: false, msg: 'Mật khẩu mới phải có tối thiểu 4 ký tự!' };
  }
  this.currentUser.password = newPass;
  const idx = DB.users.findIndex(x => x.id === this.currentUser.id);
  if(idx !== -1) DB.users[idx].password = newPass;
  save();
  return { ok: true };
 },

 /** Admin / LCĐ đặt lại mật khẩu cho tài khoản khác */
 resetMatKhau(userId, newPass){
  const u = (DB.users || []).find(x => x.id === userId);
  if(!u) return { ok: false, msg: 'Không tìm thấy tài khoản!' };
  if(!newPass || newPass.length < 4){
   return { ok: false, msg: 'Mật khẩu mới phải có tối thiểu 4 ký tự!' };
  }
  u.password = newPass;
  save();
  return { ok: true };
 },

 /** Thêm tài khoản mới */
 themTaiKhoan(data){
  const uName = String(data.username || '').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'');
  if(!uName || uName.length < 3){
   return { ok: false, msg: 'Tên đăng nhập phải có ít nhất 3 ký tự (chữ thường, số, dấu gạch)!' };
  }
  if((DB.users || []).some(x => x.username.toLowerCase() === uName)){
   return { ok: false, msg: `Tên đăng nhập "${uName}" đã tồn tại trên hệ thống!` };
  }
  if(!data.password || data.password.length < 4){
   return { ok: false, msg: 'Mật khẩu phải có tối thiểu 4 ký tự!' };
  }

  const role = data.role || 'cd';
  const newId = nextId(DB.users);
  const quyen = Array.isArray(data.quyen) && data.quyen.length ? [...data.quyen] : [...(QUYEN_THEO_VAI_TRO[role] || QUYEN_THEO_VAI_TRO.cd)];

  const newUser = {
   id: newId,
   username: uName,
   password: String(data.password).trim(),
   ten: String(data.ten || uName).trim(),
   role: role,
   cdId: role === 'cd' ? (+data.cdId || null) : null,
   email: String(data.email || '').trim(),
   sdt: String(data.sdt || '').trim(),
   active: data.active !== false,
   ngayTao: TODAY,
   lanCuoi: '',
   quyen: quyen
  };

  DB.users.push(newUser);
  save();
  return { ok: true, user: newUser };
 },

 /** Sửa tài khoản */
 suaTaiKhoan(id, data){
  const u = (DB.users || []).find(x => x.id === id);
  if(!u) return { ok: false, msg: 'Không tìm thấy tài khoản!' };

  if(data.ten !== undefined) u.ten = String(data.ten).trim();
  if(data.role !== undefined) {
   const oldRole = u.role;
   u.role = data.role;
   u.cdId = data.role === 'cd' ? (+data.cdId || null) : null;
   if(oldRole !== data.role && (!u.quyen || !u.quyen.length)){
    u.quyen = [...(QUYEN_THEO_VAI_TRO[data.role] || QUYEN_THEO_VAI_TRO.cd)];
   }
  }
  if(data.email !== undefined) u.email = String(data.email).trim();
  if(data.sdt !== undefined) u.sdt = String(data.sdt).trim();
  if(data.active !== undefined) {
   if(this.currentUser && this.currentUser.id === id && !data.active){
    return { ok: false, msg: 'Không thể tự khóa tài khoản đang đăng nhập!' };
   }
   u.active = !!data.active;
  }

  save();
  return { ok: true, user: u };
 },

 /** Xóa tài khoản */
 xoaTaiKhoan(id){
  if(this.currentUser && this.currentUser.id === id){
   return { ok: false, msg: 'Không thể xóa tài khoản bạn đang dùng để đăng nhập!' };

  const u = (DB.users || []).find(x => x.id === id);

  }

  DB.users = DB.users.filter(x => x.id !== id);
  save();
  return { ok: true };
 },

 const lcdCount = users.filter(x => x.role === 'lcd').length;

 dlg.classList.add('dlg-wide');

 ${isAdmin ? `

 </div>` : `
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;background:var(--surface-2);padding:8px 12px;border-radius:8px;border:1px solid var(--line);flex-wrap:wrap;gap:8px">
  <span style="font-size:12.5px;color:var(--sec)">Tích chọn (☑️) các quyền hạn bạn muốn cấp cho tài khoản này:</span>
  <div style="display:flex;gap:6px">
   <button type="button" class="b-s" onclick="toggleAllPerms(true)">Chọn tất cả</button>
   <button type="button" class="b-s" onclick="toggleAllPerms(false)">Bỏ chọn tất cả</button>
   <button type="button" class="b-s" onclick="resetPermsToRole('${u.role}')">Theo chuẩn vai trò</button>
  </div>
 </div>`}

 <form id="fPhanQuyen" onsubmit="xuLyLuuPhanQuyen(event, ${u.id})">
  <div class="perm-grid">
   ${DANH_SACH_QUYEN.map(q => {
    const isChecked = curQuyen.includes(q.id);
    return `
    <label class="perm-card ${isChecked ? 'is-active' : ''}">
     <div class="perm-card-check">
      <input type="checkbox" name="perms" value="${q.id}" ${isChecked ? 'checked' : ''} ${isAdmin ? 'disabled' : ''} onchange="this.closest('.perm-card').classList.toggle('is-active', this.checked)">
     </div>
     <div class="perm-card-content">
      <div class="perm-card-title">
       <b>${esc(q.ten)}</b>
       <span class="pill p-mute" style="font-size:9.5px">${esc(q.nhom)}</span>
      </div>
      <p class="perm-card-desc">${esc(q.desc)}</p>

   }).join('')}

   <button type="button" class="b-s" onclick="dlg.close();dlg.classList.remove('dlg-wide')">Đóng</button>
   ${!isAdmin ? `<button type="submit" class="b-p end">Lưu thay đổi phân quyền</button>` : ''}
  </div>
 </form>`;
 dlg.showModal();
}

function toggleAllPerms(check){
 const form = document.getElementById('fPhanQuyen');
 if(!form) return;
 form.querySelectorAll('input[name="perms"]').forEach(cb => {
  cb.checked = check;
  cb.closest('.perm-card').classList.toggle('is-active', check);
 });
}

function resetPermsToRole(role){
 const def = QUYEN_THEO_VAI_TRO[role] || QUYEN_THEO_VAI_TRO.cd;
 const form = document.getElementById('fPhanQuyen');
 if(!form) return;
 form.querySelectorAll('input[name="perms"]').forEach(cb => {
  const shouldCheck = def.includes(cb.value);
  cb.checked = shouldCheck;
  cb.closest('.perm-card').classList.toggle('is-active', shouldCheck);
 });
}

function xuLyLuuPhanQuyen(e, userId){
 e.preventDefault();
 const form = e.target;
 const selected = Array.from(form.querySelectorAll('input[name="perms"]:checked')).map(cb => cb.value);
 const res = auth.capNhatQuyenUser(userId, selected);
 if(res.ok){
  dlg.close();
  dlg.classList.remove('dlg-wide');
  auth.hienToast(`Đã lưu ${selected.length} quyền hạn cho ${res.user.ten}`);
  render();
 } else {
  alert(res.msg);
 }
}

 luu.onclick=()=>{

 return `<div class="head"><div><h1>Theo dõi hoàn thành chỉ tiêu</h1>

 ${mode==='barchart'?`
 <!-- GÓC NHÌN 1: BIỂU ĐỒ THANH THEO KẾ HOẠCH (DỄ NHÌN NHẤT) -->

document.addEventListener('click',e=>{

 const [t,s]=b.dataset.act.split('-'),id=+b.dataset.id;
 const o=(t==='bc'||t==='kh')?DB.bc.find(x=>x.id===id):DB.hd.find(x=>x.id===id);
 if(s==='no'){
  const lyDo=prompt('Nhập lý do trả lại để chi đoàn sửa bổ sung:', o.nx || 'Minh chứng chưa đủ, đề nghị bổ sung ảnh hoạt động và danh sách ký tên.');

  o.nx=lyDo.trim()||'Minh chứng chưa đạt yêu cầu, đề nghị bổ sung nộp lại.';
 }
 o.status=s==='ok'?'ok':(s==='no'?'no':'wait');
 save();render();
});

PAGES.tongket=function(){
 const xh=bangXH(),dem=l=>xh.filter(c=>c.xl[1]===l).length;
 const uuTu=DB.dv.filter(d=>d.drl>=90&&d.soHD>=5).sort((a,b)=>b.drl-a.drl);
 return `<div class="head"><img src="assets/logo.webp" alt="" style="width:54px;height:54px;border-radius:10px;background:#fff;padding:2px;object-fit:contain;border:1px solid var(--line)">
 <div><h1>Tổng kết nhiệm kỳ 2025 – 2027</h1>
  <p class="sub">Bảng căn cứ xét khen thưởng chi đoàn và đoàn viên xuất sắc.</p></div></div>
 <div class="note">Điểm KPI = tổng điểm 5 tiêu chí (mỗi tiêu chí tối đa 20) trừ điểm trừ của Liên chi đoàn.
  Điểm mỗi tiêu chí đến từ hai nguồn đã được duyệt: kế hoạch LCĐ giao (quy đổi theo tỷ lệ hoàn thành chỉ tiêu, trễ hạn còn ${TRE_PHAT*100}%) và hoạt động chi đoàn tự tổ chức.
  Xếp loại: Xuất sắc ≥ 90 · Tốt ≥ 80 · Khá ≥ 65 · Trung bình ≥ 50 · Yếu &lt; 50.</div>
 <div class="grid g4">${[['Xuất sắc','p-xs'],['Tốt','p-good'],['Khá','p-warn'],['Trung bình / Yếu','p-ser']].map((x,i)=>
  tile(x[0],i===3?dem('Trung bình')+dem('Yếu'):dem(x[0]),'chi đoàn')).join('')}</div>
 <div class="card"><header><h3>Bảng tổng hợp KPI</h3><p class="end">Số liệu chốt đến ${dmy(TODAY)}</p></header>
  <div class="scroll"><table><thead><tr><th>#</th><th>Chi đoàn</th>
  ${CRIT.map(c=>`<th class="n"${tip(c.ten+' — tối đa '+c.max+' điểm')}>${c.ten.split(' – ')[0]}</th>`).join('')}
  <th class="n">Trừ</th><th class="n">Tổng</th><th>Xếp loại</th><th class="n">Lượt TG</th><th class="n">Đoàn phí</th></tr></thead>
  <tbody>${xh.map((c,i)=>`<tr><td><span class="rk r${i+1}">${i+1}</span></td><td><b>${esc(c.ma)}</b><div class="t2">${esc(c.nganh)}</div></td>
  ${c.chiTiet.map(x=>`<td class="n">${x.diem}</td>`).join('')}
  <td class="n">${c.diemTru?'−'+c.diemTru:'–'}</td><td class="n"><b>${c.tong}</b></td><td>${pillXL(c.xl)}</td>
  <td class="n">${c.luot}</td><td class="n">${tyLePhi(c.id)}%</td></tr>`).join('')}</tbody></table></div>
  ${lgdCRIT()}</div>
 <div class="card" style="margin-top:14px"><header><h3>Đề xuất đoàn viên xuất sắc</h3><p class="end">ĐRL từ 90 và tham gia từ 5 hoạt động</p></header>
  <div class="scroll"><table><thead><tr><th>Họ và tên</th><th>Chi đoàn</th><th>Chức vụ</th><th class="n">ĐRL</th><th class="n">Số HĐ</th><th>Ghi chú</th></tr></thead>
  <tbody>${uuTu.map(d=>`<tr><td><b>${esc(d.ten)}</b></td><td>${esc(CD(d.cdId).ma)}</td><td>${esc(d.cv)}</td>
   <td class="n">${d.drl}</td><td class="n">${d.soHD}</td><td class="t2">${esc(d.ghiChu)}</td></tr>`).join('')
   ||'<tr><td colspan="6" class="empty">Chưa có đề xuất.</td></tr>'}</tbody></table></div></div>`;
};

/* ===================== TRANG — CHI ĐOÀN ===================== */
const me=()=>CD(state.cdId);
function cdTongQuan(){
 const c=me(),k=kpi(c.id),xh=bangXH(),hang=xh.findIndex(x=>x.id===c.id)+1;
 const tbKhoa=CRIT.map((cr,i)=>Math.round(xh.reduce((s,x)=>s+x.chiTiet[i].diem,0)/xh.length*10)/10);
 const dv=dvOf(c.id);

 // 1. Cần sửa (hồ sơ bị trả lại)
 const canSua=DB.bc.filter(b=>b.cdId===c.id&&b.status==='no').map(b=>({
  t:'bc',id:b.id,khId:b.khId,loai:'crit',tag:'🔴 Cần sửa',
  ten:KH(b.khId).ma+' · '+KH(b.khId).ten,
  sub:`Nộp ngày ${dmy(b.ngayNop)} · Chỉ tiêu: ${chiTieuSo(KH(b.khId),c)} lượt`,
  note:b.nx||'Minh chứng chưa đạt yêu cầu, đề nghị bổ sung ảnh hoặc danh sách sinh viên.',
  action:`formBC(${b.khId})`,
  btn:'Sửa & nộp lại ngay'
 }));

 // 2. Sắp hết hạn / Quá hạn chưa nộp
 const giao=DB.kh.filter(k2=>k2.chiTieu&&k2.batDau<=TODAY);
 const sapHetVaQua=[];
 giao.forEach(k2=>{
  const b=bcOf(k2.id,c.id);
  if(!b){
   const tre=k2.hanChot<TODAY;
   const sapHet=!tre && k2.hanChot<=dayAdd(TODAY,7);
   if(tre || sapHet || k2.batBuoc){
    sapHetVaQua.push({
     t:'kh',id:k2.id,khId:k2.id,
     loai:tre?'crit':(sapHet?'warn':'info'),
     tag:tre?'⏰ Quá hạn':(sapHet?`⚠️ Hạn ${dmy(k2.hanChot)}`:'📋 Chưa nộp'),
     ten:k2.ma+' · '+k2.ten,
     sub:`Hạn chót: ${dmy(k2.hanChot)} · Chỉ tiêu: ${chiTieuSo(k2,c)} lượt (${k2.batBuoc?'Bắt buộc':'Tự nguyện'})`,
     note:tre?'Đã quá hạn chót quy định! Nộp muộn sẽ chỉ được tối đa 80% điểm KPI.':(sapHet?'Chỉ còn ít ngày trước khi chốt hạn nộp báo cáo.':''),
     action:`formBC(${k2.id})`,
     btn:tre?'Nộp bù ngay':'Nộp báo cáo'
    });
   }
  }
 });

 // 3. Hồ sơ chờ duyệt
 const choBc=DB.bc.filter(b=>b.cdId===c.id&&b.status==='wait').map(b=>({
  t:'bc',id:b.id,khId:b.khId,loai:'pending',tag:'⏳ Chờ duyệt',
  ten:KH(b.khId).ma+' · '+KH(b.khId).ten,
  sub:`Đã gửi ${b.soLuot} lượt · Nộp ngày ${dmy(b.ngayNop)}`,
  note:'Đang trong hàng đợi thẩm định minh chứng của Ban Chấp hành LCĐ.',
  action:`go('nhiemvu')`,
  btn:'Xem chi tiết'
 }));
 const choHd=DB.hd.filter(h=>h.cdId===c.id&&h.status==='wait').map(h=>({
  t:'hd',id:h.id,loai:'pending',tag:'⏳ Chờ duyệt',
  ten:h.ten+' (Tự tổ chức)',
  sub:`Đề xuất ${h.diem} điểm · Ngày gửi ${dmy(h.ngay)}`,
  note:'Đang chờ Ban Chấp hành LCĐ phê duyệt.',
  action:`go('tuchuc')`,
  btn:'Xem hoạt động'
 }));
 const choDuyet=[...choBc,...choHd];

 // Tổng hợp việc cần làm
 const allTodos=[...canSua,...sapHetVaQua,...choDuyet];
 const tab=state.cdTab||'all';
 const filteredTodos = tab==='sua'?canSua : (tab==='han'?sapHetVaQua : (tab==='cho'?choDuyet : allTodos));

 return `<div class="head"><div><h1>${esc(c.ten)}</h1>
  <p class="sub">${esc(c.nganh)} · ${c.siSo} sinh viên · Bí thư ${esc(c.bt)} · ${esc(c.sdt)}${(()=>{const u=DB.ns.find(x=>x.theoDoi.includes(c.id));return u?' · uỷ viên BCH LCĐ theo dõi: <b>'+esc(u.ten)+'</b> ('+esc(u.sdt)+')':''})()}</p></div>
  <div class="end row">
   <button class="b-s" onclick="formCD(${c.id})">✏️ Sửa thông tin lớp</button>
   <button class="b-p" data-go="nhiemvu">+ Nộp báo cáo</button>
   <button data-go="tuchuc">+ Gửi việc tự tổ chức</button>
  </div></div>

 ${canSua.length?`
 <div class="alert-banner b-crit">
  <span class="alert-banner-icon">🚨</span>
  <div class="alert-banner-text">
   <b>Chi đoàn có ${canSua.length} hồ sơ bị trả lại do minh chứng chưa đạt yêu cầu!</b>
   <span>Vui lòng kiểm tra nhận xét của LCĐ và cập nhật lại minh chứng để kịp tính điểm KPI.</span>
  </div>
  <div class="alert-banner-act">
   <button class="b-p b-no" onclick="state.cdTab='sua';render()">Sửa ngay ↓</button>
  </div>
 </div>`: (sapHetVaQua.filter(x=>x.loai==='crit'||x.loai==='warn').length?`
 <div class="alert-banner b-warn">
  <span class="alert-banner-icon">⏰</span>
  <div class="alert-banner-text">
   <b>Chi đoàn có ${sapHetVaQua.filter(x=>x.loai==='crit'||x.loai==='warn').length} kế hoạch sắp hết hạn hoặc đã quá hạn chưa nộp báo cáo!</b>
   <span>Hãy khẩn trương tập hợp danh sách và link minh chứng để nộp đúng hạn.</span>
  </div>
  <div class="alert-banner-act">
   <button class="b-p" onclick="state.cdTab='han';render()">Xem việc gấp ↓</button>
  </div>
 </div>`:'')}

 <!-- KHỐI VIỆC CẦN LÀM CỦA CHI ĐOÀN ĐẨY LÊN ĐẦU -->
 <div class="todo-hero">
  <div class="todo-hdr">
   <div class="todo-title">
    <h2>🎯 Việc cần làm của chi đoàn</h2>
    <span class="t2">· Ưu tiên xử lý: Cần sửa → Sắp hết hạn → Chờ duyệt</span>
   </div>
   <div class="todo-tabs">
    <button type="button" class="todo-tab ${tab==='all'?'active':''}" onclick="state.cdTab='all';render()">
     Tất cả <span class="cnt">${allTodos.length}</span>
    </button>
    <button type="button" class="todo-tab ${tab==='sua'?'active':''}" onclick="state.cdTab='sua';render()">
     🔴 Cần sửa <span class="cnt">${canSua.length}</span>
    </button>
    <button type="button" class="todo-tab ${tab==='han'?'active':''}" onclick="state.cdTab='han';render()">
     ⏰ Sắp hết hạn / Quá hạn <span class="cnt">${sapHetVaQua.length}</span>
    </button>
    <button type="button" class="todo-tab ${tab==='cho'?'active':''}" onclick="state.cdTab='cho';render()">
     ⏳ Chờ LCĐ duyệt <span class="cnt">${choDuyet.length}</span>
    </button>
   </div>
  </div>

  ${filteredTodos.length?`
   <div class="todo-grid">
    ${filteredTodos.map(item=>`
     <div class="todo-item ${item.loai==='crit'?'p-urgent':item.loai==='warn'?'p-near':'p-pending'}">
      <div>
       <div class="todo-item-top">
        <span class="todo-item-title">${esc(item.ten)}</span>
        ${pill(item.tag, item.loai==='crit'?'p-crit':item.loai==='warn'?'p-warn':'p-xs')}
       </div>
       <div class="todo-item-sub">${esc(item.sub)}</div>
       ${item.note?`<div class="todo-item-note">${esc(item.note)}</div>`:''}
      </div>
      <div class="todo-item-bottom">
       <button type="button" class="b-s" onclick="moHuongDanMinhChung()">📋 Tiêu chuẩn minh chứng</button>
       <button type="button" class="b-p ${item.loai==='crit'?'b-no':''}" onclick="${item.action}">${item.btn}</button>
      </div>
     </div>`).join('')}
   </div>`: `
   <div class="empty">
    🎉 Hoan hô! Không có công việc nào trong danh mục này. Mọi việc đã được xử lý chu đáo.
   </div>`}
 </div>

 <!-- CÁC CHỈ SỐ KPI TÓM TẮT -->
 <div class="grid g4">
  ${tile('Điểm KPI',k.tong+'<span style="font-size:15px;color:var(--muted)">/100</span>',pillXL(k.xl))}
  ${tile('Xếp hạng',hang+'<span style="font-size:15px;color:var(--muted)">/'+xh.length+'</span>','Toàn khoa ('+xh[0].tong+'đ dẫn đầu)')}
  ${tile('Lượt tham gia',k.luot,'Trung bình '+huyDong(c.id)+' lượt/sinh viên')}
  ${tile('Hồ sơ đang nộp',choDuyet.length+canSua.length,canSua.length?canSua.length+' hồ sơ cần sửa':'Đang chờ LCĐ duyệt')}
 </div>

 <!-- BIỂU ĐỒ VÀ TIẾN ĐỘ CHI TIẾT -->
 <div class="grid g2">
  <div class="card"><header><h3>Tiến độ 5 tiêu chí so với trung bình khoa</h3></header>
   <div class="bars">${k.chiTiet.map((x,i)=>`<div style="margin-bottom:6px">
    <div class="t2" style="margin-bottom:4px">${x.ten}</div>
    <div class="barrow" style="grid-template-columns:minmax(64px,auto) 1fr minmax(44px,auto)"><span>Chi đoàn</span>
     <span class="track"><i style="width:${x.diem/x.max*100}%;background:${x.c}"${tip(x.ten+': '+x.diem+'/'+x.max+' điểm')}></i></span><span class="v">${x.diem}</span></div>
    <div class="barrow" style="grid-template-columns:minmax(64px,auto) 1fr minmax(44px,auto);margin-top:3px"><span class="t2">TB khoa</span>
     <span class="track" style="height:9px"><i style="width:${tbKhoa[i]/x.max*100}%;background:var(--axis)"${tip('Trung bình toàn khoa: '+tbKhoa[i]+'/'+x.max)}></i></span><span class="v t2">${tbKhoa[i]}</span></div>
   </div>`).join('')}</div>
   <div class="row" style="margin-top:8px">
    <button class="b-p" data-go="nhiemvu">Xem chi tiết hoạt động LCĐ giao</button>
    <button data-go="tuchuc">Gửi hoạt động tự tổ chức</button>
   </div>
  </div>
  <div class="card"><header><h3>Lượt tham gia theo tháng</h3><p class="end">${esc(c.ma)} so với trung bình một chi đoàn</p></header>
   ${lineChart([{n:c.ma,v:luotTheoThang(c.id),c:'var(--s1)'},{n:'TB chi đoàn',v:luotTheoThang().map(v=>Math.round(v/DB.cd.length)),c:'var(--s2)'}])}
   <div class="lgd"><span><b style="background:var(--s1)"></b>${esc(c.ma)}</span><span><b style="background:var(--s2)"></b>Trung bình một chi đoàn</span></div>
  </div>
 </div>`;
}

PAGES.nhiemvu=function(){
 const c=me();
 const rows=DB.kh.filter(k=>k.chiTieu).map(k=>({k,b:bcOf(k.id,c.id),ct:chiTieuSo(k,c),d:diemKH(k,c)}));
 rows.sort((a,b)=>soSanhKH(a.k,b.k,'near'));
 const xong=rows.filter(r=>r.b&&r.b.status==='ok').length;
 return `<div class="head"><div><h1>Hoạt động Liên chi đoàn giao</h1>
  <p class="sub">${esc(c.ten)} · ${xong}/${rows.length} đầu việc được giao đã được duyệt</p></div></div>
 <div class="grid g4">
  ${tile('Đầu việc được giao',rows.length,rows.filter(r=>r.k.batBuoc).length+' việc bắt buộc')}
  ${tile('Đã hoàn thành',xong,'Báo cáo đã được duyệt')}
  ${tile('Đang chờ duyệt',rows.filter(r=>r.b&&r.b.status==='wait').length,'Liên chi đoàn đang xử lý')}
  ${tile('Điểm đã tích luỹ',rows.reduce((s,r)=>s+r.d.diem,0).toFixed(1),'Từ các kế hoạch LCĐ')}
 </div>
 <div class="card"><div class="scroll"><table><thead><tr><th>Mã</th><th>Kế hoạch</th><th>Tiêu chí</th><th>Hạn chót</th>
  <th class="n">Chỉ tiêu</th><th class="n">Đã làm</th><th style="min-width:120px">Tiến độ</th><th class="n">Điểm</th><th>Minh chứng</th><th>Trạng thái</th><th style="min-width:130px">Thao tác</th></tr></thead>
 <tbody>${rows.map(({k,b,ct,d})=>{
  const ty=b?Math.round(b.soLuot/ct*100):0;
  const muon=!b&&k.hanChot<TODAY&&k.batDau<=TODAY;
  const mcHtml=b?hienThiLink(b.mc,'Mở link',`moSuaLink({tieuDe:'Minh chứng: ${esc(k.ma)}',url:'${esc(b.mc)}',onSave:v=>{b.mc=v}})`):'<span class="t2">–</span>';
  return `<tr><td><b>${esc(k.ma)}</b>${k.batBuoc?' '+pill('BB','p-xs'):''}</td>
  <td>${esc(k.ten)}${b&&b.status==='no'?`<div class="t2" style="color:var(--crit)">Nhận xét: ${esc(b.nx)}</div>`:''}</td>
  <td class="t2">${critOf(k.crit).ten}</td>
  <td class="t2">${dmy(k.hanChot)}${b&&b.treHan?' '+pill('nộp trễ','p-ser'):''}</td>
  <td class="n">${ct}</td><td class="n">${b?b.soLuot:'–'}</td>
  <td><span class="track"><i style="width:${Math.min(100,ty)}%;background:${ty>=100?'var(--good)':'var(--seq-4)'}"${tip(ty+'% chỉ tiêu')}></i></span></td>
  <td class="n">${d.diem||'–'}</td>
  <td>${mcHtml}</td>
  <td>${b?pillST(b.status):(muon?pill('Quá hạn','p-crit'):(k.batDau>TODAY?pill('Sắp tới','p-mute'):pill('Chưa nộp','p-warn')))}</td>
  <td class="n" style="white-space:nowrap">
   ${k.batDau<=TODAY?`<button class="b-s ${!b?'b-p':b.status==='no'?'b-no':''}" onclick="formBC(${k.id})">${!b?'Nộp báo cáo':(b.status==='ok'?'Sửa / Bổ sung':'Sửa báo cáo')}</button>`:'<span class="t2">Chưa mở</span>'}
   ${b?`<button class="b-s" onclick="moSuaLink({tieuDe:'Minh chứng: ${esc(k.ma)}',url:'${esc(b.mc)}',onSave:v=>{b.mc=v}})" title="Sửa link">🔗 Sửa link</button>`:''}
  </td></tr>`}).join('')}
 </tbody></table></div></div>`;
};

PAGES.tuchuc=function(){
 const c=me(),hd=DB.hd.filter(h=>h.cdId===c.id).sort((a,b)=>b.ngay.localeCompare(a.ngay));
 return `<div class="head"><div><h1>Hoạt động chi đoàn tự tổ chức</h1>
  <p class="sub">Ngoài kế hoạch LCĐ giao, chi đoàn gửi thêm hoạt động của mình để được cộng điểm tiêu chí. Mọi hoạt động đều có thể sửa hoặc xoá.</p></div>
  <button class="b-p end" onclick="formHD()">+ Gửi hoạt động</button></div>
 <div class="card"><div class="scroll"><table><thead><tr><th>Hoạt động</th><th>Tiêu chí</th><th>Ngày</th>
  <th class="n">Tham gia</th><th class="n">Điểm</th><th>Minh chứng</th><th>Trạng thái</th><th style="min-width:110px">Thao tác</th></tr></thead>
 <tbody>${hd.map(h=>`<tr><td><b>${esc(h.ten)}</b></td>
  <td class="t2">${critOf(h.crit).ten}</td><td class="t2">${dmy(h.ngay)}</td><td class="n">${h.sl||'–'}</td>
  <td class="n">${h.diem}</td>
  <td>${hienThiLink(h.mc,'Mở link',`moSuaLink({tieuDe:'Minh chứng: ${esc(h.ten)}',url:'${esc(h.mc)}',onSave:v=>{h.mc=v}})`)}</td>
  <td>${pillST(h.status)}</td>
  <td class="n" style="white-space:nowrap">
   <button class="b-s" onclick="formHD(${h.id})">✏️ Sửa</button>
   <button class="b-s b-no" onclick="xoaHD(${h.id})">Xoá</button>
  </td></tr>`).join('')
  ||'<tr><td colspan="8" class="empty">Chưa gửi hoạt động nào.</td></tr>'}</tbody></table></div></div>`;
};

PAGES.kpi=function(){
 const c=me(),k=kpi(c.id);
 return `<div class="head"><div><h1>KPI chi tiết — ${esc(c.ma)}</h1>
  <p class="sub">Tổng ${k.tong}/100 điểm · ${k.xl[1]}${k.diemTru?' · đã trừ '+k.diemTru+' điểm':''}</p></div></div>
 ${k.chiTiet.map(x=>`<div class="card" style="margin-bottom:12px"><header><h3>${x.ten}</h3>
  <span class="end num" style="font-family:var(--fd);font-weight:600">${x.diem}<span style="color:var(--muted)">/${x.max}</span></span></header>

  <div class="f" style="flex:1.5"><label for="cd_ten">Tên chi đoàn</label><input id="cd_ten" value="${esc(c.ten)}" placeholder="VD: Chi đoàn MIS2024A"></div>
 </div>
 <div class="row" style="gap:10px">
  <div class="f" style="flex:1"><label for="cd_nganh">Ngành / Khóa</label><input id="cd_nganh" value="${esc(c.nganh)}" placeholder="VD: MIS · K2024"></div>
  <div class="f" style="width:100px"><label for="cd_siso">Sĩ số SV</label><input id="cd_siso" type="number" min="1" value="${c.siSo||50}"></div>
 </div>
 <div class="row" style="gap:10px">
  <div class="f" style="flex:1"><label for="cd_bt">Họ tên Bí thư chi đoàn</label><input id="cd_bt" value="${esc(c.bt)}" placeholder="Họ và tên"></div>
  <div class="f" style="flex:1"><label for="cd_sdt">Số điện thoại liên hệ</label><input id="cd_sdt" value="${esc(c.sdt)}" placeholder="09xxxxxxxx"></div>
 </div>
 <div class="f"><label for="cd_dt">Điểm trừ kỷ luật (nếu có)</label><input id="cd_dt" type="number" min="0" value="${c.diemTru||0}"></div>
 <div class="row">
  <button type="button" id="huy">Huỷ</button>
  ${id?`<button type="button" class="b-no" onclick="xoaCD(${id})">Xoá chi đoàn</button>`:''}
  <button type="button" class="b-p end" id="luu">Lưu</button>
 </div>`;
 dlg.showModal();
 huy.onclick=()=>dlg.close();
 luu.onclick=()=>{
  if(!cd_ma.value.trim()) return cd_ma.focus();
  const ma = cd_ma.value.trim().toUpperCase();
  const ten = cd_ten.value.trim() || ('Chi đoàn ' + ma);
  const o = {
   ma, ten, nganh: cd_nganh.value.trim(),
   siSo: Math.max(1, +cd_siso.value||1),
   bt: cd_bt.value.trim() || '(chưa cập nhật)',
   sdt: cd_sdt.value.trim(),
   diemTru: Math.max(0, +cd_dt.value||0)
  };
  if(id) {
   Object.assign(CD(id), o);
  } else {
   const nid = nextId(DB.cd);
   DB.cd.push({id: nid, ...o});
  }
  save(); dlg.close(); render();
 };
}

function xoaCD(id){
 const c = CD(id);
 xacNhan('Xoá chi đoàn '+c.ma+'?', 'Toàn bộ báo cáo, hoạt động và đoàn viên của chi đoàn này sẽ bị xoá.', ()=>{
  DB.cd = DB.cd.filter(x=>x.id!==id);
  DB.bc = DB.bc.filter(x=>x.cdId!==id);
  DB.hd = DB.hd.filter(x=>x.cdId!==id);
  DB.dv = DB.dv.filter(x=>x.cdId!==id);
  DB.ns.forEach(u=>{u.theoDoi = (u.theoDoi||[]).filter(i=>i!==id)});
  if(state.cdId===id && DB.cd.length) state.cdId=DB.cd[0].id;
  save(); dlg.close(); render();
 });
}

/** Nhập sheet "DS NHÂN SỰ": dòng chỉ có tên ban được hiểu là tiêu đề nhóm. */
function apDungNS(rows){
 const h=rows[0];
 const iTen=cot(h,'ho va ten','ho ten'),iSdt=cot(h,'sdt','dien thoai'),iMs=cot(h,'mssv'),
  iLop=cot(h,'lop'),iVt=cot(h,'vai tro','chuc vu'),iFb=cot(h,'link fb','facebook'),iBan=cot(h,'ban');
 if(iTen<0)return{loi:'File thiếu cột “Họ và Tên”.'};
 let them=0,sua=0,banHienTai='Thường trực',nhomHienTai='bcm';
 rows.slice(1).forEach(r=>{
  const day=r.filter(c=>String(c??'').trim()!=='');
  if(day.length===1){const t=bo(day[0]);
   if(/key|nguon/.test(t)){nhomHienTai='nguon';return}
   if(/ban chap hanh|^bch/.test(t)){nhomHienTai='bch';return}
   if(/^ban |^thuong truc|^thuong vu/.test(t)){banHienTai=matBan(day[0]);nhomHienTai='bcm';return}
   return}
  const ten=String(r[iTen]??'').trim();if(!ten)return;
  const ban=iBan>=0&&r[iBan]?matBan(r[iBan]):banHienTai;
  const vt=iVt>=0&&r[iVt]?matVaiTro(r[iVt]):'Thành viên';
  const o={ten,ban,vaiTro:vt,sdt:iSdt>=0?String(r[iSdt]??'').trim():'',mssv:iMs>=0?String(r[iMs]??'').trim():'',
   lop:iLop>=0?String(r[iLop]??'').trim():'',fb:iFb>=0?String(r[iFb]??'').trim():'',
   nhom:['Bí thư','Phó Bí thư','UV BTV','UV BCH'].includes(vt)?'bch':nhomHienTai,
   bch:['Bí thư','Phó Bí thư','UV BTV','UV BCH'].includes(vt)||nhomHienTai==='bch'?1:0};
  const cu=DB.ns.find(u=>bo(u.ten)===bo(ten));
  if(cu){Object.assign(cu,o);sua++}else{DB.ns.push({id:nextId(DB.ns),theoDoi:[],...o});them++}
 });
 return {ok:'Đã thêm '+them+' nhân sự, cập nhật '+sua+' nhân sự theo ban chuyên môn.'};
}
const matBan=t=>{const x=bo(t);
 if(/tckt|to chuc|kiem tra/.test(x))return 'Ban Tổ chức – Kiểm tra';
 if(/tchc|tai chinh|hau can/.test(x))return 'Ban Tài chính – Hậu cần';
 if(/tthong|truyen thong/.test(x))return 'Ban Truyền thông';
 if(/tinh nguyen/.test(x))return 'Ban Tình nguyện';
 if(/phong trao/.test(x))return 'Ban Phong trào';
 if(/hoc tap|nckh/.test(x))return 'Ban Học tập & NCKH';
 return BAN.find(b=>bo(b)===x)||'Thường trực'};
const matVaiTro=t=>{const x=bo(t);
 return x==='bt'||x.includes('bi thu')&&!x.includes('pho')?'Bí thư':x==='pbt'||x.includes('pho bi thu')?'Phó Bí thư':
  x.includes('btv')?'UV BTV':x.includes('bch')?'UV BCH':x.includes('truong ban')?'Trưởng ban':x.includes('pho ban')?'Phó ban':'Thành viên'};
const matTienDo=t=>{const x=bo(t);return x.includes('hoan thanh')?'xong':x.includes('dang')?'dang':'chua'};
const ngayISO=t=>{const s=String(t??'').trim();
 let m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
 m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
 return ''};

function apDungTL(rows){
 const h=rows[0];
 const iTen=cot(h,'hoat dong','ten'),iTg=cot(h,'thoi gian'),iTd=cot(h,'tien do'),

 if(iTen<0)return{loi:'File thiếu cột “HOẠT ĐỘNG”.'};

 rows.slice(1).forEach(r=>{
  const ten=String(r[iTen]??'').trim();if(!ten)return;
  const hienThi=iTg>=0?String(r[iTg]??'').trim():'';
  const d=ngayISO(hienThi)||TODAY;
  const o={ten,hienThi:hienThi||dmy(d),tienDo:iTd>=0?matTienDo(r[iTd]):'chua',
   ban:iBan>=0&&r[iBan]?String(r[iBan]).split(',').map(x=>matBan(x)).filter((v,i,a)=>a.indexOf(v)===i):['Thường trực'],
   ptIds:iPt>=0&&r[iPt]?String(r[iPt]).split('/').map(x=>{const u=DB.ns.find(n=>bo(n.ten).includes(bo(x)));return u&&u.id}).filter(Boolean):[],
   note:iNote>=0?String(r[iNote]??'').trim():'',mc:iMc>=0?String(r[iMc]??'').trim():'',
   ketQua:iKq>=0?String(r[iKq]??'').trim():''};
  const cu=DB.kh.find(k=>bo(k.ten)===bo(ten));
  if(cu){Object.assign(cu,o,{ptId:o.ptIds[0]??cu.ptId});sua++}
  else{const id=nextId(DB.kh);
   DB.kh.push({id,ma:'KH-'+String(id).padStart(2,'0'),crit:'ct',batDau:d,hanChot:d,lich:[],
    diem:0,chiTieu:0,donVi:'n',batBuoc:false,ptId:o.ptIds[0],...o});them++}
 });
 return {ok:'Đã thêm '+them+' đầu việc, cập nhật '+sua+' đầu việc. Hoạt động mới chưa giao chỉ tiêu — mở từng việc để giao chỉ tiêu cho chi đoàn.'};
}
/** Nhập sheet "ĐIỂM DANH": các cột từ sau "Vai trò" là ngày sinh hoạt. */
function apDungDD(rows){
 const h=rows[0];
 const iTen=cot(h,'ho va ten','ho ten');
 if(iTen<0)return{loi:'File thiếu cột “Họ và Tên”.'};
 const cols=[];
 h.forEach((c,i)=>{const d=ngayISO(c);if(d)cols.push({i,ngay:d})});
 if(!cols.length)return{loi:'Không tìm thấy cột ngày sinh hoạt nào ở dòng tiêu đề.'};
 let buoiMoi=0,o=0;
 cols.forEach(c=>{if(!DB.hop.find(x=>x.ngay===c.ngay)){
  DB.hop.push({id:nextId(DB.hop),ten:'Họp Liên chi đoàn KHUD',ngay:c.ngay,noiDung:'',bienBan:''});buoiMoi++}});
 rows.slice(1).forEach(r=>{
  const ten=String(r[iTen]??'').trim();if(!ten)return;
  const u=DB.ns.find(x=>bo(x.ten)===bo(ten));if(!u)return;
  cols.forEach(c=>{
   const hop=DB.hop.find(x=>x.ngay===c.ngay);
   const v=bo(r[c.i]);
   const co=['true','x','có','co','1','v','yes'].includes(v),muon=v.includes('muon');
   let d=ddOf(hop.id,u.id);
   if(d){d.co=co||muon;d.muon=muon}else DB.dd.push({hopId:hop.id,nsId:u.id,co:co||muon,muon});
   o++;
  });
 });
 return {ok:'Đã cập nhật '+o+' ô điểm danh'+(buoiMoi?', tạo mới '+buoiMoi+' buổi sinh hoạt':'')+'.'};
}

/** Xoay một ô điểm danh: chưa điểm danh → có mặt → đi muộn → vắng → chưa điểm danh. */
function doiDiemDanh(hopId,nsId){
 const d=ddOf(hopId,nsId);
 if(!d){DB.dd.push({hopId,nsId,co:true,muon:false});return}
 if(d.co&&!d.muon){d.muon=true;return}
 if(d.co&&d.muon){d.co=false;d.muon=false;return}
 DB.dd=DB.dd.filter(x=>x!==d);
}
/** Đặt thẳng một trạng thái: 'co' | 'muon' | 'vang' | 'trong'. */
function datDiemDanh(hopId,nsId,tt){
 DB.dd=DB.dd.filter(d=>!(d.hopId===hopId&&d.nsId===nsId));
 if(tt==='co')DB.dd.push({hopId,nsId,co:true,muon:false});
 if(tt==='muon')DB.dd.push({hopId,nsId,co:true,muon:true});
 if(tt==='vang')DB.dd.push({hopId,nsId,co:false,muon:false});
}

  return `<tr><td><b>${esc(u.ten)}</b><div class="t2">${esc(u.vaiTro)} · ${esc(u.ban)}</div></td>

  return `<tr><td colspan="2" style="padding-top:12px;font:600 11px var(--ff);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)">${ten}</td></tr>`
   +ds.map(hang).join('')}).join('');

 <p class="sub">${esc(h.ten)} · hiện có mặt ${co}/${DB.ns.length}</p>
